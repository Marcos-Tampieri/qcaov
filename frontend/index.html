<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <title>QCADesigner Simulation Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>QCADesigner Simulation Viewer</h1>
            <div class="file-picker-container">
                <label for="file-input" class="btn-primary">Select Simulation File</label>
                <input type="file" id="file-input" accept=".txt,.log,*">
                <span id="file-name" class="file-name">No file selected</span>
            </div>
        </header>

        <section id="metadata-panel" class="metadata-panel"></section>

        <main id="simulation-results" class="simulation-results">
            <div class="placeholder">Select a QCADesigner log file to visualize simulation traces.</div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
